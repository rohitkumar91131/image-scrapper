<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 50" width="200" height="50">
  <!-- Sharp Pixel Box -->
  <rect x="0" y="5" width="40" height="40" fill="#111111" />
  <rect x="15" y="15" width="15" height="15" fill="#f9f9f9" />
  
  <!-- Text: PIXEL (Bold, heavy, sans-serif) -->
  <text x="52" y="32" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="28" fill="#111111" letter-spacing="-1">PIXEL</text>
  
  <!-- Text: VAULT (Editorial, serif, spaced) -->
  <text x="54" y="45" font-family="Times New Roman, serif" font-size="12" fill="#111111" letter-spacing="4">VAULT</text>
</svg>
